# Groups minor and patch updates so Dependabot opens one PR per ecosystem
# instead of one PR per package. Security updates use these groups too.
# Major bumps stay as their own PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /common
    schedule:
      interval: weekly
      day: monday
    groups:
      common-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
    groups:
      api-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
