# Resource-capped staging on the prod EC2. Use with docker-compose.yml:
#   COMPOSE_PROJECT_NAME=prism-staging
#   COMPOSE_FILE=docker-compose.yml:docker-compose.staging.yml
# Prod Traefik (container name traefik, ports 443/8080) stays in the prod project.
# This file must not publish host port 80.

networks:
  traefik_default:
    external: true

volumes:
  staging_db_data:

services:
  db:
    image: kartoza/postgis:16-3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "!ChangeMe!"
    volumes:
      - staging_db_data:/var/lib/postgresql
    mem_limit: 768m
    memswap_limit: 768m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    shm_size: "512mb"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "0.50"
    ports: !reset []
    networks:
      - default
      - traefik_default
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.staging-api.rule=Host(`${HOSTNAME:?Must provide hostname}`)"
      - "traefik.http.routers.staging-api.entrypoints=websecure"
      - "traefik.http.routers.staging-api.tls.certresolver=myresolver"
      - "traefik.http.services.staging-api.loadbalancer.server.port=80"
    environment:
      - "RUN=uvicorn prism_app.main:app --host 0.0.0.0 --port 80 --proxy-headers --forwarded-allow-ips=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1"
      - BROWSER_POOL_SIZE=1
      - MAIL_SUBJECT_PREFIX=${MAIL_SUBJECT_PREFIX:-}
      - PRISM_ALERTS_DATABASE_URL=${PRISM_ALERTS_DATABASE_URL:?Provide a URL for the alerts database.}
      - KOBO_PASSWORD=${KOBO_PASSWORD:?Add a password to access KOBO data.}
      - KOBO_USERNAME=${KOBO_USERNAME:?Add a user to access KOBO data.}
      - HDC_TOKEN=${HDC_TOKEN:?Provide a token to access HDC chart data.}
      - STAC_AWS_ACCESS_KEY_ID=${STAC_AWS_ACCESS_KEY_ID:?Provide the AWS access key for the stac api.}
      - STAC_AWS_SECRET_ACCESS_KEY=${STAC_AWS_SECRET_ACCESS_KEY:?Provide the AWS secret key for the stac api.}
      - GOOGLE_FLOODS_API_KEY=${GOOGLE_FLOODS_API_KEY:?Provide the Google Floods API key.}
      - VECTOR_STORE_ACCESS_KEY_ID=${VECTOR_STORE_ACCESS_KEY_ID}
      - VECTOR_STORE_SECRET_ACCESS_KEY=${VECTOR_STORE_SECRET_ACCESS_KEY}
      - VECTOR_STORE_DEFAULT_REGION=${VECTOR_STORE_DEFAULT_REGION}
      - PRISM_OIDC_ISSUER=${PRISM_OIDC_ISSUER:?Provide the CIAM OIDC issuer URL.}
      - PRISM_OIDC_REDIRECT_URI=${PRISM_OIDC_REDIRECT_URI:?Provide the OIDC redirect URI.}
      - PRISM_OIDC_CLIENT_ID=${PRISM_OIDC_CLIENT_ID:?Provide the CIAM OIDC client ID.}
      - PRISM_OIDC_CLIENT_SECRET=${PRISM_OIDC_CLIENT_SECRET:?Provide the CIAM OIDC client secret.}
      - PRISM_ENTRA_OIDC_TENANT_ID=${PRISM_ENTRA_OIDC_TENANT_ID:-}
      - PRISM_ENTRA_OIDC_CLIENT_ID=${PRISM_ENTRA_OIDC_CLIENT_ID:-}
      - PRISM_ENTRA_OIDC_CLIENT_SECRET=${PRISM_ENTRA_OIDC_CLIENT_SECRET:-}
      - PRISM_SESSION_SECRET=${PRISM_SESSION_SECRET:?Provide the session signing secret.}
      - PRISM_SESSION_TTL_SECONDS=${PRISM_SESSION_TTL_SECONDS:-604800}
      - PRISM_ENV=${PRISM_ENV:-development}
      - API_URL=${API_URL:-}
      - GIT_SHA=${GIT_SHA:-}
      - GIT_BRANCH=${GIT_BRANCH:-}
    command:
      - uvicorn
      - prism_app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "80"
      - --proxy-headers
      - --forwarded-allow-ips=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1
    restart: unless-stopped

  export_map_worker:
    shm_size: "1gb"
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: "0.50"
    environment:
      - BROWSER_POOL_SIZE=1
      - MAIL_SUBJECT_PREFIX=${MAIL_SUBJECT_PREFIX:-}
      - PRISM_ALERTS_DATABASE_URL=${PRISM_ALERTS_DATABASE_URL:?Provide a URL for the alerts database.}
      - PRISM_ENV=${PRISM_ENV:-development}
      - EXPORT_MAP_S3_BUCKET=${EXPORT_MAP_S3_BUCKET:-s3://prism-wfp/batch-maps-staging}
      - API_URL=${API_URL:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-${VECTOR_STORE_DEFAULT_REGION:-}}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
